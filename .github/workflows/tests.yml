name: tests

# Test locally while iterating; request CI explicitly for a substantial PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic unittest suite
        run: python3 -m unittest discover -s tests
